        @theme static {

<body class="relative overflow-x-hidden bg-gris-claro font-poppins">

    <!-- ESTA PARTE SE REPITE EN TODAS LAS PAGINAS HTML (la img y el header)  -->

    <img src="media/img/LOGO PNG BLANCO.png" alt="Logo de Teo Sillas"

    <header class="fixed top-5 left-5 z-20 flex items-center gap-4 md:top-8 md:left-8">

            class="fixed top-5 right-5 z-20 flex h-10 w-10 items-center justify-center text-azul md:top-8 md:right-8">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-10 w-10" aria-hidden="true">
